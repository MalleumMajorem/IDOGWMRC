<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Defiance of God's Will Mythic+ Roll Chooser</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        h1 { 
            color: #bb86fc; 
            text-align: center; 
            text-transform: uppercase;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .input-group { 
            margin-bottom: 12px; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            background: #1e1e1e; 
            color: #fff; 
            border: 1px solid #333; 
            border-radius: 4px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #bb86fc;
        }
        .checkbox-group { 
            margin: 20px 0; 
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .checkbox-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .checkbox-group label:last-child {
            margin-bottom: 0;
        }
        input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #bb86fc; 
            color: #121212; 
            border: none; 
            border-radius: 4px;
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: background 0.2s;
        }
        button:hover { 
            background: #9965f4; 
        }
        .result-card { 
            background: #1e1e1e; 
            border-left: 4px solid #bb86fc; 
            padding: 15px; 
            margin-top: 12px; 
            border-radius: 0 4px 4px 0;
        }
        .player-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .role { 
            font-weight: bold; 
            color: #03dac6; 
            float: right;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .spec {
            color: #aaa;
            margin-top: 8px;
            font-size: 14px;
        }
        .error {
            color: #cf6679;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>In Defiance of God's Will<br>Mythic+ Roll Chooser</h1>
    
    <div id="inputs">
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 1 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 2 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 3 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 4 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 5 Name"></div>
    </div>

    <div class="checkbox-group">

        <label><input type="checkbox" id="reqHeal" checked> Require Healer</label>

    </div>

    <button onclick="generateRoles()">Defy God's Will</button>
