<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Defiance of God's Will Mythic+ Roll Chooser</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        h1 { 
            color: #bb86fc; 
            text-align: center; 
            text-transform: uppercase;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .input-group { 
            margin-bottom: 12px; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            background: #1e1e1e; 
            color: #fff; 
            border: 1px solid #333; 
            border-radius: 4px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #bb86fc;
        }
        .checkbox-group { 
            margin: 20px 0; 
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .checkbox-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .checkbox-group label:last-child {
            margin-bottom: 0;
        }
        input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #bb86fc; 
            color: #121212; 
            border: none; 
            border-radius: 4px;
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: background 0.2s;
        }
        button:hover { 
            background: #9965f4; 
        }
        .result-card { 
            background: #1e1e1e; 
            border-left: 4px solid #bb86fc; 
            padding: 15px; 
            margin-top: 12px; 
            border-radius: 0 4px 4px 0;
        }
        .player-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .role { 
            font-weight: bold; 
            color: #03dac6; 
            float: right;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .spec {
            color: #aaa;
            margin-top: 8px;
            font-size: 14px;
        }
        .error {
            color: #cf6679;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>In Defiance of God's Will<br>Mythic+ Roll Chooser</h1>
    
    <div id="inputs">
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 1 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 2 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 3 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 4 Name"></div>
        <div class="input-group"><input type="text" class="player-input" placeholder="Player 5 Name"></div>
    </div>

    <div class="checkbox-group">
        <label><input type="checkbox" id="reqTank" checked> Require Tank</label>
        <label><input type="checkbox" id="reqHeal" checked> Require Healer</label>
    </div>

    <button onclick="generateRoles()">Defy God's Will</button>

    <div id="output" style="margin-top: 20px;"></div>

    <script>
        // Updated for Midnight Season 1
        const wowClasses = {
            "Death Knight": { Tank: ["Blood"], DPS: ["Frost", "Unholy"], Healer: [] },
            "Demon Hunter": { Tank: ["Vengeance"], DPS: ["Havoc", "Devourer"], Healer: [] },
            "Druid": { Tank: ["Guardian"], DPS: ["Balance", "Feral"], Healer: ["Restoration"] },
            "Evoker": { Tank: [], DPS: ["Augmentation", "Devastation"], Healer: ["Preservation"] },
            "Hunter": { Tank: [], DPS: ["Beast Mastery", "Marksmanship", "Survival"], Healer: [] },
            "Mage": { Tank: [], DPS: ["Arcane", "Fire", "Frost"], Healer: [] },
            "Monk": { Tank: ["Brewmaster"], DPS: ["Windwalker"], Healer: ["Mistweaver"] },
            "Paladin": { Tank: ["Protection"], DPS: ["Retribution"], Healer: ["Holy"] },
            "Priest": { Tank: [], DPS: ["Shadow"], Healer: ["Discipline", "Holy"] },
            "Rogue": { Tank: [], DPS: ["Assassination", "Outlaw", "Subtlety"], Healer: [] },
            "Shaman": { Tank: [], DPS: ["Elemental", "Enhancement"], Healer: ["Restoration"] },
            "Warlock": { Tank: [], DPS: ["Affliction", "Demonology", "Destruction"], Healer: [] },
            "Warrior": { Tank: ["Protection"], DPS: ["Arms", "Fury"], Healer: [] }
        };

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function getRandomClassAndSpec(role) {
            const validClasses = Object.keys(wowClasses).filter(cls => wowClasses[cls][role].length > 0);
            const chosenClass = getRandomItem(validClasses);
            const chosenSpec = getRandomItem(wowClasses[chosenClass][role]);
            return { cls: chosenClass, spec: chosenSpec };
        }

        function generateRoles() {
            const nameInputs = document.querySelectorAll('.player-input');
            let names = [];
            nameInputs.forEach(input => {
                if (input.value.trim() !== '') {
                    names.push(input.value.trim());
                }
            });

            const reqTank = document.getElementById('reqTank').checked;
            const reqHeal = document.getElementById('reqHeal').checked;
            const output = document.getElementById('output');
            
            output.innerHTML = '';

            if (names.length === 0) {
                output.innerHTML = '<p class="error">Please enter at least one player name.</p>';
                return;
            }

            let requiredRoles = [];
            if (reqTank) requiredRoles.push('Tank');
            if (reqHeal) requiredRoles.push('Healer');

            let assignments = [];
            names = shuffleArray(names);

            // Logic: Less names entered than checked boxes
            if (names.length < requiredRoles.length && names.length > 0) {
                // Randomly pick ONE of the checked roles to assign
                let randomlyPickedRole = getRandomItem(requiredRoles);
                assignments.push({ name: names.pop(), role: randomlyPickedRole });
                
                // If there are remaining names (e.g., 2 names, but somehow fell into this block, fall back to DPS)
                while(names.length > 0) {
                    assignments.push({ name: names.pop(), role: 'DPS' });
                }
            } else {
                // Logic: Force one name to each checked role (Max 1 Tank, Max 1 Heal)
                if (reqTank && names.length > 0) {
                    assignments.push({ name: names.pop(), role: 'Tank' });
                }
                if (reqHeal && names.length > 0) {
                    assignments.push({ name: names.pop(), role: 'Healer' });
                }
                
                // The rest are DPS
                while (names.length > 0) {
                    assignments.push({ name: names.pop(), role: 'DPS' });
                }
            }

            // Generate HTML for each assigned player
            assignments.forEach(assign => {
                const build = getRandomClassAndSpec(assign.role);
                const div = document.createElement('div');
                div.className = 'result-card';
                div.innerHTML = `
                    <span class="player-name">${assign.name}</span>
                    <span class="role">${assign.role}</span>
                    <div class="spec">${build.spec} ${build.cls}</div>
                `;
                output.appendChild(div);
            });
        }
    </script>
</body>
</html>
